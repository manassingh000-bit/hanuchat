<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HanuChat - Live Glassmorphism Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(18, 24, 38, 0.6)',
                        glassBorder: 'rgba(255, 255, 255, 0.12)',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            color: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .glass-input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Animated Glowing Orbs Background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            z-index: 0;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 350px; height: 350px; background: #7c3aed; top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: #2563eb; bottom: -80px; right: -80px; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #ec4899; top: 40%; left: 40%; animation-delay: -10s; }

        @keyframes floatOrb {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.15); }
            100% { transform: translate(-40px, 50px) scale(0.9); }
        }

        /* Theme Styles */
        .theme-dark-glass { --grad-sent: linear-gradient(135deg, #8b5cf6, #d946ef); }
        .theme-neon-purple { --grad-sent: linear-gradient(135deg, #a855f7, #ec4899); }
        .theme-cyberpunk { --grad-sent: linear-gradient(135deg, #06b6d4, #3b82f6); }
        .theme-sunset { --grad-sent: linear-gradient(135deg, #f97316, #e11d48); }
        .theme-emerald { --grad-sent: linear-gradient(135deg, #10b981, #06b6d4); }

        .bubble-sent {
            background: var(--grad-sent, linear-gradient(135deg, #8b5cf6, #d946ef));
            border-top-right-radius: 4px;
        }
        .bubble-received {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-left-radius: 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* Calling Animation */
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
            animation: pulse 1.6s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse {
            to { box-shadow: 0 0 0 30px rgba(139, 92, 246, 0); }
        }
    </style>
</head>
<body class="theme-dark-glass text-slate-100 flex justify-center items-center h-screen w-screen relative select-none">

    <div id="orb1" class="orb orb-1"></div>
    <div id="orb2" class="orb orb-2"></div>
    <div id="orb3" class="orb orb-3"></div>

    <div class="relative z-10 w-full h-full md:h-[94vh] md:max-w-6xl md:rounded-3xl glass-panel shadow-2xl overflow-hidden flex flex-col md:flex-row border border-white/10">

        <aside id="sidebar" class="w-full md:w-80 h-full flex flex-col border-r border-white/10 glass-panel z-20 transition-all duration-300">
            <!-- App Header -->
            <div class="p-4 flex items-center justify-between border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-purple-500/30">
                        <i class="fa-solid font-bold text-white">H</i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">HanuChat</h1>
                        <p class="text-xs text-slate-400 flex items-center gap-1">
                            <span id="statusIndicator" class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                            <span id="statusText">Online</span>
                        </p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openModal('settingsModal')" class="w-9 h-9 rounded-xl glass-input flex items-center justify-center hover:bg-white/10 text-slate-300 transition" title="Settings">
                        <i class="fa-solid fa-gear text-sm"></i>
                    </button>
                    <button onclick="openModal('firebaseModal')" class="w-9 h-9 rounded-xl glass-input flex items-center justify-center hover:bg-white/10 text-amber-400 transition" title="Firebase Config">
                        <i class="fa-solid fa-database text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="p-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-400"></i>
                    <input type="text" id="searchChat" onkeyup="filterChats()" placeholder="Search contacts or rooms..." class="w-full glass-input text-xs rounded-xl pl-8 pr-3 py-2.5 focus:outline-none">
                </div>
            </div>

            <!-- Chat List -->
            <div id="chatList" class="flex-1 overflow-y-auto px-2 space-y-1">
                <!-- Dynamic chats rendered here via JS -->
            </div>

            <!-- User Profile Footer -->
            <div class="p-3 border-t border-white/10 flex items-center justify-between bg-black/20">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=MyUser" class="w-9 h-9 rounded-xl bg-purple-900/50 border border-purple-500/30">
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="truncate">
                        <p id="currentUserNameDisplay" class="text-xs font-semibold text-slate-200 truncate">Hanu User</p>
                        <p class="text-[10px] text-slate-400">Local Session</p>
                    </div>
                </div>
                <button onclick="editUsername()" class="text-xs text-purple-400 hover:text-purple-300 p-2">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
            </div>
        </aside>

        <main id="chatMain" class="flex-1 h-full flex flex-col bg-slate-950/40 relative">
            <!-- Active Chat Header -->
            <header id="chatHeader" class="p-3.5 md:p-4 border-b border-white/10 glass-panel flex items-center justify-between z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-300 hover:text-white p-2">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="relative">
                        <img id="activeChatAvatar" src="https://api.dicebear.com/7.x/identicon/svg?seed=Global" class="w-10 h-10 rounded-2xl bg-slate-800 border border-white/10">
                        <span id="activeStatusDot" class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div>
                        <h2 id="activeChatTitle" class="font-bold text-sm md:text-base text-slate-100">Global Room</h2>
                        <p id="activeChatSubtitle" class="text-[11px] text-slate-400">Public Live Chat</p>
                    </div>
                </div>
                
                <!-- Calling & Options Buttons -->
                <div class="flex items-center gap-1.5 md:gap-2">
                    <button onclick="startCall('audio')" class="w-9 h-9 rounded-xl glass-input flex items-center justify-center hover:bg-emerald-500/20 text-emerald-400 hover:border-emerald-500/50 transition">
                        <i class="fa-solid fa-phone text-xs"></i>
                    </button>
                    <button onclick="startCall('video')" class="w-9 h-9 rounded-xl glass-input flex items-center justify-center hover:bg-purple-500/20 text-purple-400 hover:border-purple-500/50 transition">
                        <i class="fa-solid fa-video text-xs"></i>
                    </button>
                    <button onclick="clearCurrentChat()" class="w-9 h-9 rounded-xl glass-input flex items-center justify-center hover:bg-rose-500/20 text-rose-400 hover:border-rose-500/50 transition" title="Clear Chat">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>
            </header>

            <!-- Messages Window -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Messages populate here -->
            </div>

            <!-- Media Preview Bar (Hidden by default) -->
            <div id="mediaPreviewBar" class="hidden px-4 py-2 bg-slate-900/80 border-t border-white/10 flex items-center justify-between">
                <div id="previewContent" class="flex items-center gap-3 text-xs text-slate-300">
                    <!-- Dynamic preview injected here -->
                </div>
                <button onclick="clearMediaPreview()" class="text-rose-400 text-xs hover:text-rose-300 p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Input Box Section -->
            <footer class="p-3 md:p-4 border-t border-white/10 glass-panel">
                <form id="messageForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                    <button type="button" onclick="triggerImageUpload()" class="w-10 h-10 rounded-xl glass-input flex items-center justify-center hover:bg-white/10 text-slate-300 transition shrink-0" title="Attach Image">
                        <i class="fa-solid fa-image text-sm"></i>
                    </button>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
                    
                    <button type="button" id="micBtn" onclick="toggleVoiceNote()" class="w-10 h-10 rounded-xl glass-input flex items-center justify-center hover:bg-white/10 text-slate-300 transition shrink-0" title="Voice Note">
                        <i class="fa-solid fa-microphone text-sm"></i>
                    </button>

                    <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 glass-input text-sm rounded-xl px-4 py-2.5 focus:outline-none">
                    
                    <button type="submit" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 hover:opacity-90 text-white flex items-center justify-center shadow-lg shadow-purple-500/25 shrink-0 transition">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <div id="callModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-2xl flex flex-col items-center justify-between p-6 hidden">
        <!-- Top Status -->
        <div class="text-center mt-4">
            <span id="callTypeBadge" class="text-[10px] tracking-widest uppercase bg-purple-500/20 text-purple-300 border border-purple-500/30 px-3 py-1 rounded-full">Encrypted Call</span>
            <h3 id="callTargetName" class="text-2xl font-bold text-white mt-2">Global Contact</h3>
            <p id="callTimer" class="text-xs text-slate-400 mt-1">Ringing...</p>
        </div>

        <!-- Video Display Container -->
        <div class="relative w-full max-w-lg aspect-video rounded-3xl overflow-hidden glass-panel border border-white/20 my-auto flex items-center justify-center shadow-2xl">
            <!-- Remote Simulated Feed -->
            <video id="remoteVideo" class="w-full h-full object-cover hidden" autoplay playsinline></video>
            <div id="callAvatarFallback" class="flex flex-col items-center gap-3">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 p-1 pulse-ring">
                    <img id="callAvatarImg" src="https://api.dicebear.com/7.x/identicon/svg?seed=Global" class="w-full h-full rounded-full bg-slate-900 object-cover">
                </div>
            </div>
            <!-- Local User PiP Video -->
            <video id="localVideo" class="absolute bottom-3 right-3 w-28 h-20 rounded-2xl object-cover border border-white/30 hidden" autoplay playsinline muted></video>
        </div>

        <!-- Call Action Controls -->
        <div class="flex items-center gap-6 mb-6">
            <button id="toggleMicBtn" onclick="toggleCallMic()" class="w-12 h-12 rounded-2xl glass-input flex items-center justify-center text-white hover:bg-white/20 transition">
                <i class="fa-solid fa-microphone text-lg"></i>
            </button>
            <button onclick="endCall()" class="w-16 h-16 rounded-3xl bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center shadow-lg shadow-rose-600/40 transition scale-105">
                <i class="fa-solid fa-phone-slash text-xl"></i>
            </button>
            <button id="toggleCamBtn" onclick="toggleCallCam()" class="w-12 h-12 rounded-2xl glass-input flex items-center justify-center text-white hover:bg-white/20 transition">
                <i class="fa-solid fa-video text-lg"></i>
            </button>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-md glass-panel rounded-3xl p-6 border border-white/10 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-white"><i class="fa-solid fa-palette text-purple-400 mr-2"></i>Theme & Settings</h3>
                <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Theme Options Grid -->
            <div class="space-y-4">
                <label class="text-xs font-medium text-slate-300 block">Select Color Theme</label>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="setTheme('theme-dark-glass')" class="p-3 rounded-2xl border border-white/10 bg-slate-900/60 flex items-center gap-2 hover:border-purple-500 text-xs text-left">
                        <span class="w-4 h-4 rounded-full bg-gradient-to-r from-purple-500 to-pink-500"></span>
                        Dark Glass
                    </button>
                    <button onclick="setTheme('theme-neon-purple')" class="p-3 rounded-2xl border border-white/10 bg-slate-900/60 flex items-center gap-2 hover:border-pink-500 text-xs text-left">
                        <span class="w-4 h-4 rounded-full bg-gradient-to-r from-purple-500 to-pink-500"></span>
                        Neon Purple
                    </button>
                    <button onclick="setTheme('theme-cyberpunk')" class="p-3 rounded-2xl border border-white/10 bg-slate-900/60 flex items-center gap-2 hover:border-cyan-500 text-xs text-left">
                        <span class="w-4 h-4 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500"></span>
                        Cyber Teal
                    </button>
                    <button onclick="setTheme('theme-sunset')" class="p-3 rounded-2xl border border-white/10 bg-slate-900/60 flex items-center gap-2 hover:border-orange-500 text-xs text-left">
                        <span class="w-4 h-4 rounded-full bg-gradient-to-r from-orange-500 to-rose-500"></span>
                        Sunset Red
                    </button>
                    <button onclick="setTheme('theme-emerald')" class="p-3 rounded-2xl border border-white/10 bg-slate-900/60 flex items-center gap-2 hover:border-emerald-500 text-xs text-left col-span-2">
                        <span class="w-4 h-4 rounded-full bg-gradient-to-r from-emerald-500 to-teal-500"></span>
                        Emerald Green
                    </button>
                </div>

                <!-- Reset Local Cache -->
                <div class="pt-4 border-t border-white/10">
                    <button onclick="resetAllData()" class="w-full py-2.5 rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30 text-xs font-semibold transition">
                        Reset Local Messages & Data
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="firebaseModal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-md glass-panel rounded-3xl p-6 border border-white/10 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-lg text-amber-400"><i class="fa-solid fa-fire mr-2"></i>Firebase Live Sync</h3>
                <button onclick="closeModal('firebaseModal')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <p class="text-xs text-slate-300">Enter your Firebase Database Config keys below for real-time multi-device sync, or keep empty for fast local session chat.</p>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">API Key</label>
                    <input type="text" id="fbApiKey" class="w-full glass-input text-xs rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Database URL</label>
                    <input type="text" id="fbDbUrl" placeholder="https://your-app-default-rtdb.firebaseio.com" class="w-full glass-input text-xs rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Project ID</label>
                    <input type="text" id="fbProjectId" class="w-full glass-input text-xs rounded-xl px-3 py-2">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveFirebaseConfig()" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition">
                    Save & Sync Live
                </button>
                <button onclick="disconnectFirebase()" class="py-2.5 px-4 rounded-xl glass-input hover:bg-white/10 text-xs text-slate-300">
                    Use Local Mode
                </button>
            </div>
        </div>
    </div>

    <script>
        // State variables
        let currentUser = localStorage.getItem('hanu_username') || 'Hanu User ' + Math.floor(100 + Math.random() * 900);
        let activeChatId = 'global';
        let firebaseApp = null;
        let firebaseDb = null;
        let selectedMedia = null; // { type: 'image'|'audio', data: string }
        let callActive = false;
        let localStream = null;
        let callTimerInterval = null;

        // Default Chat Rooms & Contacts
        const defaultChats = [
            { id: 'global', name: 'Global Room', subtitle: 'Public Community Chat', avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=Global', isRoom: true },
            { id: 'tech', name: 'Tech & Developers', subtitle: 'Coding & Web Apps', avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=Tech', isRoom: true },
            { id: 'priya', name: 'Priya Sharma', subtitle: 'Online', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Priya', isRoom: false },
            { id: 'rahul', name: 'Rahul Verma', subtitle: 'Away', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul', isRoom: false }
        ];

        // Automatic Bot Responses for Offline Simulation
        const autoReplies = {
            priya: ["Hey! How is the HanuChat app working on your mobile?", "Looks super smooth with the glassmorphism design! ✨", "Call me whenever you're free!"],
            rahul: ["Yo! Let's test the video calling feature.", "Awesome dark mode gradients! 🚀"],
            tech: ["Welcome to Tech Room! Feel free to paste code snippets.", "Firebase Realtime DB sync is ready for connection."],
            global: ["Hello everyone! Welcome to HanuChat Global Community."]
        };

        // Initialize App
        window.onload = function() {
            document.getElementById('currentUserNameDisplay').innerText = currentUser;
            renderChatList();
            loadMessages();
            checkSavedFirebase();
        };

        function renderChatList() {
            const listEl = document.getElementById('chatList');
            listEl.innerHTML = '';

            defaultChats.forEach(chat => {
                const isActive = chat.id === activeChatId;
                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl flex items-center gap-3 cursor-pointer transition ${isActive ? 'bg-purple-600/30 border border-purple-500/30' : 'hover:bg-white/5'}`;
                item.onclick = () => selectChat(chat.id);

                item.innerHTML = `
                    <div class="relative shrink-0">
                        <img src="${chat.avatar}" class="w-10 h-10 rounded-2xl bg-slate-800 border border-white/10">
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 ${chat.isRoom ? 'bg-purple-400' : 'bg-emerald-500'} border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 truncate">
                        <div class="flex items-center justify-between">
                            <h4 class="font-semibold text-xs text-slate-200 truncate">${chat.name}</h4>
                            <span class="text-[10px] text-slate-500">Live</span>
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${chat.subtitle}</p>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function selectChat(id) {
            activeChatId = id;
            const chat = defaultChats.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('activeChatTitle').innerText = chat.name;
            document.getElementById('activeChatSubtitle').innerText = chat.subtitle;
            document.getElementById('activeChatAvatar').src = chat.avatar;

            renderChatList();
            loadMessages();

            // Mobile view toggle
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        function getStorageKey() {
            return `hanuchat_msg_${activeChatId}`;
        }

        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (firebaseDb) {
                // Listen to Firebase path
                firebaseDb.ref(`chats/${activeChatId}`).limitToLast(50).on('value', snapshot => {
                    container.innerHTML = '';
                    const data = snapshot.val();
                    if (data) {
                        Object.values(data).forEach(msg => renderMessageBubble(msg));
                    }
                    scrollToBottom();
                });
            } else {
                // LocalStorage Fallback
                const stored = localStorage.getItem(getStorageKey());
                const messages = stored ? JSON.parse(stored) : getInitialDefaultMessages();
                messages.forEach(msg => renderMessageBubble(msg));
                scrollToBottom();
            }
        }

        function getInitialDefaultMessages() {
            return [
                { sender: 'System', text: 'Welcome to ' + activeChatId.toUpperCase() + '! Send a message to start chatting.', time: '12:00 PM', isSystem: true }
            ];
        }

        function renderMessageBubble(msg) {
            const container = document.getElementById('messagesContainer');
            const isMe = msg.sender === currentUser;

            if (msg.isSystem) {
                const sysEl = document.createElement('div');
                sysEl.className = "text-center my-2";
                sysEl.innerHTML = `<span class="text-[10px] bg-white/5 border border-white/10 px-3 py-1 rounded-full text-slate-400">${msg.text}</span>`;
                container.appendChild(sysEl);
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;

            let mediaHtml = '';
            if (msg.image) {
                mediaHtml = `<img src="${msg.image}" class="max-w-[200px] rounded-xl mb-1 border border-white/20">`;
            } else if (msg.audio) {
                mediaHtml = `
                    <div class="flex items-center gap-2 bg-black/20 p-2 rounded-xl mb-1">
                        <i class="fa-solid fa-play text-xs text-purple-300"></i>
                        <span class="text-[11px] font-mono text-slate-300">Voice Note (0:05)</span>
                    </div>
                `;
            }

            wrapper.innerHTML = `
                <span class="text-[10px] text-slate-400 px-1">${msg.sender} • ${msg.time}</span>
                <div class="max-w-[80%] md:max-w-[65%] p-3 rounded-2xl text-xs leading-relaxed text-white shadow-lg ${isMe ? 'bubble-sent' : 'bubble-received'}">
                    ${mediaHtml}
                    ${msg.text ? `<div>${escapeHtml(msg.text)}</div>` : ''}
                </div>
            `;

            container.appendChild(wrapper);
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !selectedMedia) return;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const newMsg = {
                sender: currentUser,
                text: text,
                time: time,
                image: selectedMedia?.type === 'image' ? selectedMedia.data : null,
                audio: selectedMedia?.type === 'audio' ? selectedMedia.data : null
            };

            if (firebaseDb) {
                firebaseDb.ref(`chats/${activeChatId}`).push(newMsg);
            } else {
                // Save Local
                const stored = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
                stored.push(newMsg);
                localStorage.setItem(getStorageKey(), JSON.stringify(stored));
                renderMessageBubble(newMsg);
                scrollToBottom();

                // Trigger Automated Reply if offline contact
                triggerAutoReply();
            }

            input.value = '';
            clearMediaPreview();
        }

        function triggerAutoReply() {
            const replies = autoReplies[activeChatId];
            if (!replies) return;

            setTimeout(() => {
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const botMsg = {
                    sender: document.getElementById('activeChatTitle').innerText,
                    text: randomReply,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                const stored = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
                stored.push(botMsg);
                localStorage.setItem(getStorageKey(), JSON.stringify(stored));
                renderMessageBubble(botMsg);
                scrollToBottom();
            }, 1200);
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function triggerImageUpload() {
            document.getElementById('imageInput').click();
        }

        function handleImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedMedia = { type: 'image', data: e.target.result };
                showMediaPreview('<i class="fa-solid fa-image text-purple-400"></i> Image attached ready to send');
            };
            reader.readAsDataURL(file);
        }

        function toggleVoiceNote() {
            if (selectedMedia?.type === 'audio') {
                clearMediaPreview();
            } else {
                selectedMedia = { type: 'audio', data: 'voice_note_simulated' };
                showMediaPreview('<i class="fa-solid fa-microphone text-pink-400"></i> Simulated Voice Note attached');
            }
        }

        function showMediaPreview(html) {
            const bar = document.getElementById('mediaPreviewBar');
            document.getElementById('previewContent').innerHTML = html;
            bar.classList.remove('hidden');
        }

        function clearMediaPreview() {
            selectedMedia = null;
            document.getElementById('mediaPreviewBar').classList.add('hidden');
            document.getElementById('imageInput').value = '';
        }

        function startCall(type) {
            callActive = true;
            const modal = document.getElementById('callModal');
            const chatName = document.getElementById('activeChatTitle').innerText;
            const chatAvatar = document.getElementById('activeChatAvatar').src;

            document.getElementById('callTargetName').innerText = chatName;
            document.getElementById('callAvatarImg').src = chatAvatar;
            document.getElementById('callTypeBadge').innerText = type === 'video' ? 'Video Call' : 'Audio Call';
            
            modal.classList.remove('hidden');

            let seconds = 0;
            document.getElementById('callTimer').innerText = 'Connecting...';
            
            callTimerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                document.getElementById('callTimer').innerText = `${mins}:${secs}`;
            }, 1000);

            // Request Camera/Mic stream if supported
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true })
                    .then(stream => {
                        localStream = stream;
                        const localVid = document.getElementById('localVideo');
                        localVid.srcObject = stream;
                        if (type === 'video') localVid.classList.remove('hidden');
                    })
                    .catch(err => {
                        console.log('Camera access denied or simulated device:', err);
                    });
            }
        }

        function endCall() {
            callActive = false;
            clearInterval(callTimerInterval);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('callModal').classList.add('hidden');
            document.getElementById('localVideo').classList.add('hidden');
        }

        function toggleCallMic() {
            const btn = document.getElementById('toggleMicBtn');
            btn.classList.toggle('bg-rose-500/40');
        }

        function toggleCallCam() {
            const btn = document.getElementById('toggleCamBtn');
            btn.classList.toggle('bg-rose-500/40');
            const localVid = document.getElementById('localVideo');
            localVid.classList.toggle('hidden');
        }

        function setTheme(themeName) {
            document.body.className = `${themeName} text-slate-100 flex justify-center items-center h-screen w-screen relative select-none`;
            localStorage.setItem('hanuchat_theme', themeName);
            closeModal('settingsModal');
        }

        function editUsername() {
            const newName = prompt('Enter your name:', currentUser);
            if (newName && newName.trim()) {
                currentUser = newName.trim();
                localStorage.setItem('hanu_username', currentUser);
                document.getElementById('currentUserNameDisplay').innerText = currentUser;
            }
        }

        function clearCurrentChat() {
            if (confirm('Clear all messages in this chat?')) {
                localStorage.removeItem(getStorageKey());
                loadMessages();
            }
        }

        function resetAllData() {
            if (confirm('Reset all saved local messages and settings?')) {
                localStorage.clear();
                location.reload();
            }
        }

        function filterChats() {
            const query = document.getElementById('searchChat').value.toLowerCase();
            const items = document.getElementById('chatList').children;
            Array.from(items).forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function saveFirebaseConfig() {
            const apiKey = document.getElementById('fbApiKey').value.trim();
            const databaseURL = document.getElementById('fbDbUrl').value.trim();
            const projectId = document.getElementById('fbProjectId').value.trim();

            if (!apiKey || !databaseURL) {
                alert('Please enter at least API Key and Database URL');
                return;
            }

            const config = { apiKey, databaseURL, projectId };
            localStorage.setItem('hanu_fb_config', JSON.stringify(config));
            initFirebase(config);
            closeModal('firebaseModal');
        }

        function checkSavedFirebase() {
            const saved = localStorage.getItem('hanu_fb_config');
            if (saved) {
                try {
                    const config = JSON.parse(saved);
                    document.getElementById('fbApiKey').value = config.apiKey || '';
                    document.getElementById('fbDbUrl').value = config.databaseURL || '';
                    document.getElementById('fbProjectId').value = config.projectId || '';
                    initFirebase(config);
                } catch(e){}
            }
        }

        function initFirebase(config) {
            try {
                if (!firebase.apps.length) {
                    firebaseApp = firebase.initializeApp(config);
                } else {
                    firebaseApp = firebase.app();
                }
                firebaseDb = firebase.database();
                document.getElementById('statusIndicator').className = 'w-2 h-2 rounded-full bg-amber-400 inline-block';
                document.getElementById('statusText').innerText = 'Firebase Sync';
                loadMessages();
            } catch(e) {
                alert('Firebase Connection Error: ' + e.message);
            }
        }

        function disconnectFirebase() {
            localStorage.removeItem('hanu_fb_config');
            firebaseDb = null;
            document.getElementById('statusIndicator').className = 'w-2 h-2 rounded-full bg-emerald-500 inline-block';
            document.getElementById('statusText').innerText = 'Local Online';
            closeModal('firebaseModal');
            loadMessages();
        }

        // Modal Helpers
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
